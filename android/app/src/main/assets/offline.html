<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>SpotiLIE - Offline</title>
    <style>
        body {
            background-color: #121212;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 0 24px;
            box-sizing: border-box;
            text-align: center;
        }
        .icon { font-size: 64px; margin-bottom: 24px; }
        h1 { font-size: 24px; margin-bottom: 8px; }
        p { color: #b3b3b3; margin-bottom: 32px; line-height: 1.4; }
        #status { color: #6a6a6a; font-size: 13px; margin-top: 20px; min-height: 1em; }
        button {
            background-color: #1db954;
            color: black;
            border: none;
            padding: 14px 36px;
            border-radius: 24px;
            font-size: 16px;
            font-weight: bold;
            transition: transform 0.1s;
        }
        button:active { transform: scale(0.95); }
    </style>
</head>
<body>
    <div class="icon">📶</div>
    <h1>Connection Unavailable</h1>
    <p>SpotiLIE couldn't reach Spotify.<br>It will reconnect automatically.</p>
    <button onclick="retry()">Try Again</button>
    <div id="status"></div>

    <script>
        // Retry on our own rather than waiting for a tap: the app also reloads
        // when Android reports a validated network, this covers the rest.
        var attempt = 0;
        var DELAYS = [5, 10, 20, 30, 60];
        var status = document.getElementById('status');

        function retry() {
            status.textContent = 'Connecting…';
            window.location.href = "https://open.spotify.com";
        }

        function schedule() {
            var delay = DELAYS[Math.min(attempt++, DELAYS.length - 1)];
            var left = delay;
            var tick = setInterval(function () {
                if (--left <= 0) {
                    clearInterval(tick);
                    if (navigator.onLine) retry(); else schedule();
                    return;
                }
                status.textContent = navigator.onLine
                    ? 'Retrying in ' + left + 's'
                    : 'Waiting for a connection…';
            }, 1000);
        }

        window.addEventListener('online', retry);
        schedule();
    </script>
</body>
</html>
